[package]
name = "vpram-engine"
version = "0.1.0"
edition = "2021"
authors = ["VPRAM Team"]
description = "Vector Parallel Random Access Memory Engine - Rust Integration Layer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anuceo/VPRAM-Engine"

[lib]
name = "vpram_engine"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC server
tonic = "0.11"
prost = "0.12"

# WebSocket support
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Julia FFI integration (uncomment when Julia dev headers are available)
# Requires: Julia 1.6+ installed with development headers
# On Debian/Ubuntu: apt-get install julia-dev
# On macOS: brew install julia
# jlrs = { version = "0.19" }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]

[features]
default = []
# Feature flag for Julia runtime integration (requires jlrs dependency)
julia-runtime = []

[[bin]]
name = "vpram-server"
path = "src/bin/vpram_server.rs"

[[example]]
name = "basic_kernel"
path = "examples/basic_kernel.rs"

[[example]]
name = "grpc_client"
path = "examples/grpc_client.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
